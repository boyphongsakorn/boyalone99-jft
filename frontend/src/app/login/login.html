<main class="login-page">
  <div class="ambient ambient-left" aria-hidden="true"></div>
  <div class="ambient ambient-right" aria-hidden="true"></div>

  <section class="login-panel" aria-labelledby="login-title">
    <a class="brand-lockup" routerLink="/" aria-label="Go to BoyAlone99 Community rewards">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">BoyAlone99<small>Community</small></span>
    </a>

    <div class="intro">
      <p class="eyebrow">Community access</p>
      <h1 id="login-title">Come back to<br /><em>your people.</em></h1>
      <p class="intro-copy">เข้าสู่ชุมชน BoyAlone99 แล้วกลับมาพบกับทุกคน</p>
    </div>

    <div class="provider-list" aria-label="Sign in options">
      <button class="provider-button discord" type="button" (click)="handleLogin('Discord')">
        <span class="provider-icon" aria-hidden="true">D</span>
        <span>Continue with Discord</span>
        <span class="arrow" aria-hidden="true">&#8594;</span>
      </button>
      <button class="provider-button twitch" type="button" (click)="handleLogin('Twitch')">
        <span class="provider-icon" aria-hidden="true">T</span>
        <span>Continue with Twitch</span>
        <span class="arrow" aria-hidden="true">&#8594;</span>
      </button>
      <button class="provider-button youtube" type="button" (click)="handleLogin('YouTube')">
        <span class="provider-icon" aria-hidden="true">&#9654;</span>
        <span>Continue with YouTube</span>
        <span class="arrow" aria-hidden="true">&#8594;</span>
      </button>
    </div>

    <p class="terms">By continuing, you agree to our <a href="/terms">Terms</a><br />and acknowledge our <a href="/privacy">Privacy Policy</a>.</p>

    <footer class="login-footer">
      <span>Built for the people<br />in our community.</span>
      <div class="footer-links">
        <a class="back-button" routerLink="/">&#8592; Rewards</a>
        <a class="back-button" routerLink="/profile">Profile</a>
      </div>
    </footer>
  </section>
</main>
